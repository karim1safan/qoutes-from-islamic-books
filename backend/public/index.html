<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <title>مقتطفات دينية من كتب السلف</title>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-book-half mx-2"></i>مقتطفات دينية من كتب السلف
            </a>
        
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4">

        <!-- Search & Filter Bar -->
        <div id="search-bar" class="row g-3 mb-4 align-items-center">
            <div class="col-12 col-md-8">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="bi bi-search text-muted"></i>
                    </span>
                    <input
                        type="text"
                        id="search-input"
                        class="form-control border-start-0"
                        placeholder="ابحث في المقتطفات..."
                        autocomplete="off"
                    >
                </div>
            </div>
            <div class="col-12 col-md-4">
                <select id="sort-select" class="form-select">
                    <option value="newest">الأحدث أولاً</option>
                    <option value="oldest">الأقدم أولاً</option>
                </select>
            </div>
        </div>

        <!-- Posts Count -->
        <div id="posts-count" class="d-none mb-3"></div>

        <!-- Loading Spinner -->
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-secondary" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">جاري التحميل...</span>
            </div>
            <p class="mt-3 text-muted">جاري تحميل المقتطفات...</p>
        </div>

        <!-- Error Message -->
        <div id="error-message" class="alert alert-danger text-center d-none" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            حدث خطأ أثناء تحميل المقتطفات. يرجى المحاولة لاحقاً.
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="text-center py-5 d-none">
            <i class="bi bi-journal-x display-1 text-muted"></i>
            <p class="mt-3 text-muted fs-5">لا توجد مقتطفات حالياً</p>
        </div>

        <!-- Posts Grid -->
        <div id="posts-grid" class="row g-4 d-none">
            <!-- Cards will be inserted here by main.js -->
        </div>

        <!-- Pagination -->
        <nav id="pagination" class="d-none mt-4" aria-label="التنقل بين الصفحات">
            <div class="d-flex justify-content-center align-items-center gap-2">
                <button id="btn-next" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                    <i class="bi bi-chevron-left"></i> التالي
                </button>
                <span id="page-info" class="text-muted mx-2"></span>
                <button id="btn-prev" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                    السابق <i class="bi bi-chevron-right"></i>
                </button>
            </div>
        </nav>
    </main>

    <!-- Lightbox Modal -->
    <div class="modal fade" id="lightboxModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-header border-0 pb-0">
                    <h5 id="lightbox-title" class="modal-title text-white"></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="إغلاق"></button>
                </div>
                <div class="modal-body text-center p-0">
                    <img id="lightbox-image" src="" alt="" class="img-fluid rounded shadow">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>
</html>
